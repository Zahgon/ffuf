# Build metadata, filtered by the Maven build: the release version injection and the VCS stamp and module
# version of the source. A release build passes -Dffuf.version=X.Y.Z -Dffuf.versionAppendix=
# and a build from another checkout passes its own -Dffuf.vcs.* values.
VERSION=${ffuf.version}
VERSION_APPENDIX=${ffuf.versionAppendix}
vcs.revision=${ffuf.vcs.revision}
vcs.time=${ffuf.vcs.time}
vcs.modified=${ffuf.vcs.modified}
mod.version=${ffuf.mod.version}
