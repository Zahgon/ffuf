name: test
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  # Build the jar and run the JUnit suite on Linux and macOS.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: mvn test
        run: mvn -B test
      - name: mvn package
        run: mvn -B -DskipTests package
